<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matteuppgifter — PDF-generator</title>
  </head>
  <body>
    <main>
      <h1>Matteuppgifter</h1>
      <p class="subtitle">
        Skapa övningsblad med addition, subtraktion, multiplikation och division — allt körs i
        webbläsaren, inget lämnar din dator.
      </p>

      <div class="quickstart" id="quickstart"></div>

      <div id="warnings"></div>

      <div class="app-layout">
        <div class="settings-panel" id="settings-panel"></div>
        <div class="preview-panel">
          <iframe id="preview" title="Förhandsvisning av PDF"></iframe>
          <div class="actions">
            <button type="button" id="download-button" class="primary">Ladda ner PDF</button>
            <button type="button" id="print-button">Skriv ut</button>
            <button type="button" id="reset-button">Återställ</button>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
